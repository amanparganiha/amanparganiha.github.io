name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages accepts one deployment at a time. Without this, two pushes a
# minute apart race: the second run builds fine, then the Pages API rejects it
# with a 400 because the first is still deploying. Queueing them means a burst
# of commits ends in one deploy of the final state instead of a red run.
#
# `cancel-in-progress: false` on purpose — cancelling mid-deploy is what leaves
# the site serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
